defaults:
  - paths: default
  - matrix: default
  - _self_

pooled_metrics_file: pooled_metrics.json

label_fontsize: 10.0
bar_height: 0.6
line_width: 0.8

output:
  path: ${paths.results_root}/plots/ce_star_decomposition.pdf

hydra:
  job:
    chdir: false
  run:
    dir: ${paths.outputs_root}/hydra_logs/${hydra.job.config_name}/single/${now:%Y-%m-%d}_${now:%H-%M-%S}
  sweep:
    dir: ${paths.outputs_root}/hydra_logs/${hydra.job.config_name}/multirun/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${hydra.job.num}
