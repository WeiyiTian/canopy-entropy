defaults:
  - paths: default
  - matrix: default
  - _self_

mode: kde
label_fontsize: 14.0
line_width: 1.6

bins: 50
symlog_linthresh: 1.0
symlog_linscale: 0.1
n_eval_points: 1000

output:
  path: ${paths.results_root}/plots/sequence_length_${mode}.pdf

hydra:
  job:
    chdir: false
  run:
    dir: ${paths.outputs_root}/hydra_logs/${hydra.job.config_name}/single/${now:%Y-%m-%d}_${now:%H-%M-%S}
  sweep:
    dir: ${paths.outputs_root}/hydra_logs/${hydra.job.config_name}/multirun/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${hydra.job.num}
