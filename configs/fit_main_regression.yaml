defaults:
  - paths: default
  - matrix: default
  - _self_

prompt_stats_file: prompt_rollout_stats.pt

regression:
  formula: "D ~ R_bar + N_bar + C(task) + C(model_name) * C(model_variant)"
  groups: prompt_uid

output:
  results_path: ${paths.results_root}/stats/main_regression.json

hydra:
  job:
    chdir: false
  run:
    dir: ${paths.outputs_root}/hydra_logs/${hydra.job.config_name}/single/${now:%Y-%m-%d}_${now:%H-%M-%S}
  sweep:
    dir: ${paths.outputs_root}/hydra_logs/${hydra.job.config_name}/multirun/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${hydra.job.num}
