defaults:
  - paths: default
  - _self_

panel:
  models: [Qwen3-8b, Llama-3.1-8b]
  datasets: [coding, math, stories]
  variants: [base, instruct]
  run_name: default
  prompt_stats_file: prompt_rollout_stats.pt

regression:
  formula: "D ~ R_bar * C(model_variant, Treatment(reference='base')) + N_bar + C(task) + C(model_name)"
  groups: prompt_uid
  ft_variant: instruct

output:
  results_path: ${paths.results_root}/stats/interaction_regression.json

hydra:
  job:
    chdir: false
  run:
    dir: ${paths.outputs_root}/hydra_logs/${hydra.job.config_name}/single/${now:%Y-%m-%d}_${now:%H-%M-%S}
  sweep:
    dir: ${paths.outputs_root}/hydra_logs/${hydra.job.config_name}/multirun/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${hydra.job.num}
