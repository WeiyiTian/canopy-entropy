defaults:
  - paths: default
  - matrix: default
  - judge: openrouter
  - _self_

run_name: ${matrix.run_name}
tag: ${run_name}
prompt_stats_file: prompt_rollout_stats.pt

# reuse an existing panel csv
resume: true

r_script: scripts/stats/rse_ordered_beta_regression.r

output:
  panel_csv: ${paths.results_root}/stats/${tag}/${judge.name}/rse_panel.csv
  r_log: ${paths.results_root}/stats/${tag}/${judge.name}/rse_ordered_beta_regression.log

hydra:
  job:
    chdir: false
  run:
    dir: ${paths.outputs_root}/hydra_logs/${hydra.job.config_name}/single/${now:%Y-%m-%d}_${now:%H-%M-%S}
  sweep:
    dir: ${paths.outputs_root}/hydra_logs/${hydra.job.config_name}/multirun/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${hydra.job.num}
