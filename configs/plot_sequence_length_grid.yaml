defaults:
  - paths: default
  - matrix: default
  - _self_

bins: 50
label_fontsize: 11.0

output:
  path: ${paths.results_root}/plots/sequence_length_grid.pdf

hydra:
  job:
    chdir: false
  run:
    dir: ${paths.outputs_root}/hydra_logs/${hydra.job.config_name}/single/${now:%Y-%m-%d}_${now:%H-%M-%S}
  sweep:
    dir: ${paths.outputs_root}/hydra_logs/${hydra.job.config_name}/multirun/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${hydra.job.num}
