# @package _global_
defaults:
  - override /hydra/launcher: submitit_slurm

hydra:
  launcher:
    timeout_min: 720
    mem_gb: 8
    cpus_per_task: 4
    nodes: 1
    tasks_per_node: 1
    array_parallelism: 1
    partition: general
    additional_parameters:
      export: "ALL,PYTHONUNBUFFERED=1"
